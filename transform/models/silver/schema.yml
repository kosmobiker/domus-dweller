version: 2

models:
  - name: listing_identity
    columns:
      - name: source_listing_id
        tests:
          - not_null
      - name: source
        tests:
          - not_null
      - name: mode
        tests:
          - not_null
      - name: first_seen_at
        tests:
          - not_null
      - name: last_seen_at
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: listing_current
    columns:
      - name: source_listing_id
        tests:
          - not_null
      - name: title
        tests:
          - not_null
      - name: price_total
        tests:
          - not_null
      - name: area_sqm
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: seller_segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['private', 'professional', 'unknown']
